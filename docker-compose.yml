services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nba
      POSTGRES_PASSWORD: nba
      POSTGRES_DB: nba_scout
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nba -d nba_scout"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
