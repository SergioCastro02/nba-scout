[project]
name = "nba-scout"
version = "0.1.0"
description = "Multi-agent NBA assistant: rulebook/CBA knowledge base (RAG) + live stats, orchestrated with LangGraph."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sergio Castro" }]

dependencies = [
    "langgraph>=1,<2",
    "langchain-core>=1,<2",
    "langchain-aws>=1,<2",
    "langchain-anthropic>=1,<2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "fastembed>=0.4",
    "pypdf>=5",
    "numpy>=2",
    "platformdirs>=4",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
nba-scout = "nba_scout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nba_scout"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
